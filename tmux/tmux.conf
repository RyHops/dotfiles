set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Prefix: Ctrl+a (like Josean)
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes
unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Resize panes (vim keys)
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# Zoom pane
bind -r m resize-pane -Z

# Attach session to current path
bind M-c attach-session -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# --- Claude Code (per code.claude.com/docs/en/terminal-config + fullscreen + agent-teams) ---
# Let Claude Code notifications / progress / agent-team status escape tmux to the outer terminal
set -g allow-passthrough on
# Shift+Enter inserts a newline in Claude Code prompts instead of submitting
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Let apps (Claude Code panes) detect focus changes
set -g focus-events on

# --- Multi-agent ergonomics ---
# Bigger scrollback for verbose agent output
set -g history-limit 50000
# Keep window numbers contiguous when agent windows close
set -g renumber-windows on
# Size windows to the smallest client actually viewing them (better for grouped sessions)
setw -g aggressive-resize on
# Label each pane so teammate agents are identifiable at a glance
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{?#{pane_title},#{pane_title},#{pane_current_command}} "

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reduce ESC delay for Neovim
set -sg escape-time 10

# --- Catppuccin (MUST be before TPM) ---
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_status_background 'none'

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# --- Status line (MUST be after catppuccin loads via TPM) ---
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -g status-right-length 100
